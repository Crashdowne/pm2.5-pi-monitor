# Read-only analytics sidecar for the PM2.5 warehouse.
#
# Runs alongside server/ingest.py on the VPS and is reachable only over Tailscale.
# It reads the warehouse database (never writes to it) and keeps its own small
# alert-state database on a named volume.
services:
  aqi-site:
    image: crashdowne/pi-aqi-monitor:latest
    build:
      context: ..
      dockerfile: aqi-site/Dockerfile
    container_name: aqi-site
    restart: unless-stopped
    # Bind to loopback and publish over the tailnet, OR set the host to your
    # Tailscale IP, e.g. "100.100.100.100:8080:8080". Do not expose publicly.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AQI_SITE_DB: /data/pm25.db
      AQI_SITE_STATE_DB: /state/aqi-site-state.db
      AQI_SITE_CONFIG: /config/config.toml
      # Reading a live WAL database requires write access to the directory so
      # SQLite can attach its -shm/-wal files. The app enforces PRAGMA query_only
      # so it can never modify your data. To read a static snapshot instead, set
      # AQI_SITE_DB_IMMUTABLE=true and mount the warehouse read-only (:ro).
    volumes:
      - /var/lib/pm25-server:/data
      - ./config.example.toml:/config/config.toml:ro
      - aqi-site-state:/state

volumes:
  aqi-site-state:

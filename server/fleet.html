<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b1220" />
<title>PM2.5 Fleet</title>
<style>
  :root { --bg: #0b1220; --panel: #111a2e; --text: #e6edf7; --muted: #93a1b8; --line: #1e293b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px ui-sans-serif, system-ui, sans-serif; }
  main { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  h1, h2 { margin: 0; letter-spacing: 0; } h1 { font-size: 20px; } h2 { font-size: 15px; }
  .muted, #status { color: var(--muted); font-size: 12px; }
  .table-wrap { overflow-x: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 600; }
  tbody tr { cursor: pointer; } tbody tr:hover, tbody tr:focus { background: var(--panel); outline: none; }
  .aqi { display: inline-block; min-width: 42px; padding: 4px 7px; color: #111; text-align: center; font-weight: 700; border-radius: 4px; }
  .detail { margin-top: 28px; } .detail[hidden] { display: none; }
  .detail-head { display: flex; justify-content: space-between; margin-bottom: 12px; }
  canvas { width: 100%; height: 190px; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<main>
  <header><h1>Air Quality Fleet</h1><span id="status">Loading monitors...</span></header>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Sensor</th><th>AQI</th><th>PM2.5</th><th>Updated</th><th>24h coverage</th><th>Temperature / RH</th></tr></thead>
      <tbody id="fleet"></tbody>
    </table>
  </div>
  <section class="detail" id="detail" hidden>
    <div class="detail-head"><h2 id="detail-name"></h2><span class="muted">Last 24 hours</span></div>
    <canvas id="history" role="img" aria-label="Selected sensor particulate history"></canvas>
  </section>
</main>
<script type="module" src="/fleet.js"></script>
</body>
</html>

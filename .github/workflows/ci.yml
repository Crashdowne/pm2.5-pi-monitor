name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - run: uv run python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: node --check web/app.js && node --check web/charts.js && node --check web/sw.js && node --check server/fleet.js
      - run: bash -n deploy/install.sh deploy/update.sh

  aqi-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
        working-directory: aqi-worker
      - run: npm run typecheck
        working-directory: aqi-worker
      - run: npm test
        working-directory: aqi-worker
      - run: npm install
        working-directory: aqi-worker/web
      - run: npm run build
        working-directory: aqi-worker/web
      - run: npx wrangler deploy --dry-run --outdir /tmp/aqi-worker-out
        working-directory: aqi-worker
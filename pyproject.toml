[project]
name = "pm25-pi-monitor"
version = "0.2.0"
description = "Outdoor PM2.5/PM10 monitor for Raspberry Pi Zero 2 W (DietPi) with an installable PWA dashboard and Tailscale offload"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",       # 3.1 pulls Werkzeug>=3.1, past the 3.0.x security fixes
    "waitress>=3.0.2",  # excludes 3.0.0 (request-smuggling advisories)
    "requests>=2.32.4", # excludes <2.32.4 (.netrc credential leak / verify persistence)
]

# Hardware-only deps. Install on the Pi with:  uv sync --extra pi
[project.optional-dependencies]
pi = [
    "pyserial>=3.5",
    "gpiozero>=2.0",
    "lgpio>=0.2",
    "smbus2>=0.4",
]

[project.scripts]
pm25-reader = "pm25.reader:main"
pm25-web = "pm25.web:main"
pm25-sync = "pm25.sync:main"
pm25-alert = "pm25.alerts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm25"]

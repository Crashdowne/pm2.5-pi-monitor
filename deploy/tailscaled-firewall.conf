# Installed by deploy/install.sh as tailscaled.service.d/pm25-firewall.conf.
# Re-apply the pm25 egress firewall once tailscaled's cgroup exists so its control/DERP traffic is allowed.
[Unit]
After=pm25-firewall.service

[Service]
ExecStartPost=-/bin/sh -c 'test -f /etc/pm25/firewall.env && /usr/local/sbin/pm25-firewall apply || true'
